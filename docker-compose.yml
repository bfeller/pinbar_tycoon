services:
  pinbar-tycoon:
    image: pinbar-tycoon:latest
    build: .
    pull_policy: build        # built locally — never try to pull from a registry
    ports:
      - "3080:80"
    restart: unless-stopped
    depends_on:
      scores:
        condition: service_healthy

  scores:
    image: pinbar-tycoon-scores:latest
    build: ./server
    pull_policy: build        # built locally — never try to pull from a registry
    environment:
      - DB_PATH=/data/highscores.sqlite
    volumes:
      - highscores:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  highscores:
