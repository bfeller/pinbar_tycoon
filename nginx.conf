server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve the scores service IP when containers restart
    # (plain proxy_pass http://scores:3000 freezes the IP at nginx startup).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # High-score API — proxy to the scores backend container
    location /api/ {
        set $scores_host scores;
        # $request_uri required when the host is a variable, or the path is dropped
        proxy_pass http://$scores_host:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # SPA routing — send all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
