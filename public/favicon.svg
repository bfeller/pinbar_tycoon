<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Win95 navy background with bevel -->
  <rect width="64" height="64" rx="6" fill="#000080"/>
  <rect x="1" y="1" width="62" height="62" rx="5.5" fill="none" stroke="#aaaacc" stroke-width="2"/>
  <path d="M63 63 L63 1 L62 2 L62 62 L2 62 L1 63 Z" fill="#000040"/>

  <!-- Playfield -->
  <rect x="7" y="7" width="50" height="50" rx="3" fill="#0a3a0a"/>
  <!-- Playfield lane guides -->
  <line x1="7" y1="37" x2="14" y2="50" stroke="#1a5a1a" stroke-width="1.5"/>
  <line x1="57" y1="37" x2="50" y2="50" stroke="#1a5a1a" stroke-width="1.5"/>

  <!-- Pop bumpers — classic triangle layout -->
  <!-- Top center (red) -->
  <circle cx="32" cy="18" r="5.5" fill="#e0e0e0"/>
  <circle cx="32" cy="18" r="4" fill="#cc0000"/>
  <circle cx="32" cy="18" r="2" fill="#ff6666"/>
  <circle cx="31" cy="17" r="0.8" fill="#ffffff" opacity="0.9"/>

  <!-- Lower-left (yellow) -->
  <circle cx="21" cy="28" r="4.5" fill="#e0e0e0"/>
  <circle cx="21" cy="28" r="3" fill="#cc8800"/>
  <circle cx="21" cy="28" r="1.5" fill="#ffcc00"/>
  <circle cx="20" cy="27" r="0.7" fill="#ffffff" opacity="0.9"/>

  <!-- Lower-right (yellow) -->
  <circle cx="43" cy="28" r="4.5" fill="#e0e0e0"/>
  <circle cx="43" cy="28" r="3" fill="#cc8800"/>
  <circle cx="43" cy="28" r="1.5" fill="#ffcc00"/>
  <circle cx="42" cy="27" r="0.7" fill="#ffffff" opacity="0.9"/>

  <!-- Pinball -->
  <circle cx="32" cy="40" r="6" fill="#c8c8c8"/>
  <circle cx="32" cy="40" r="6" fill="url(#ball-grad)"/>
  <circle cx="29.5" cy="37.5" r="2.2" fill="#ffffff" opacity="0.7"/>

  <!-- Flippers -->
  <!-- Left: pivot at left, tip pointing right -->
  <path d="M11 56 Q19 49 29 51" stroke="#c0c0c0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Right: pivot at right, tip pointing left -->
  <path d="M53 56 Q45 49 35 51" stroke="#c0c0c0" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <defs>
    <radialGradient id="ball-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#808080"/>
    </radialGradient>
  </defs>
</svg>
